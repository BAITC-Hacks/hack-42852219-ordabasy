services:
  backend:
    build:
      context: .
      target: production
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8000}:8000"
    environment:
      APP_APP_NAME: ${APP_APP_NAME:-AstanaInnovation}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_API_V1_PREFIX: ${APP_API_V1_PREFIX:-/api/v1}
      APP_CORS_ORIGINS: '${APP_CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173"]}'
      APP_PUBLIC_API_BASE_URL: ${APP_PUBLIC_API_BASE_URL:-/api}
      APP_ANALYSIS_MODE: ${APP_ANALYSIS_MODE:-remote}
      APP_OPENAI_MODEL: ${APP_OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    init: true
    restart: unless-stopped

  tests:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      APP_ENV: test
      APP_DEBUG: "false"
      APP_ANALYSIS_MODE: disabled
